/* 手機置中；外部不放文字或介紹區塊。 */
.layout{display:flex;align-items:center;justify-content:center;gap:0;max-width:none;padding:28px 16px;min-height:100svh}
.stage{flex-shrink:0}.wall-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.wall-choice{padding:7px;background:#fff;border:2px solid #ead6e2;border-radius:15px;color:#81546e;text-align:left}
.wall-choice[aria-pressed="true"]{border-color:#ae6c92;box-shadow:0 0 0 2px #efd5e4}
.wall-thumb{display:block;height:115px;border-radius:9px;background:linear-gradient(140deg,#f7dbe7,#f1b7d2,#e6bedf);background-size:cover;background-position:center}
.wall-name{display:block;font-size:11px;padding:8px 2px 3px}.icon img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
@media(max-width:390px){.layout{padding:20px 5px}}

/* 備忘錄：兩份相同格式的角色資料，可點標題收合。 */
.character-note{border:1px solid #ead6e2;border-radius:18px;background:#fff;margin:14px 0;overflow:hidden}
.character-note summary{cursor:pointer;padding:18px 16px;color:#83516d;font-size:16px;font-weight:600;background:#faf0f6;line-height:1.5}
.character-note summary::marker{color:#bc86a5;font-size:12px}
.character-note summary:focus-visible{outline:2px solid #a04c7d;outline-offset:-4px;border-radius:16px}
.note-content{padding:2px 16px 20px}.note-content h3{font-size:14px;font-weight:700;color:#895a74;letter-spacing:1px;border-bottom:1px solid #efdee7;padding-bottom:9px;margin:24px 0 13px}
.note-content p{font-size:13px;line-height:2;color:#765a6a;overflow-wrap:anywhere;margin:0 0 15px}
.note-content p:last-child{margin-bottom:0}.profile-list{list-style:none;padding:0;margin:0;color:#765a6a;font-size:13px;line-height:2}
.profile-list li{margin:4px 0}.profile-list strong{font-weight:600;color:#80566f}

/* 通訊錄列表：點卡片開啟獨立的角色詳情。 */
.contact-card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.contact-card:hover{background:#fffafd;border-color:#c992b2}.contact-card:active{background:#f9edf5}
.contact-card .avatar{margin:5px auto 15px}.contact-card strong{font-size:13px;font-weight:500}
.contact-card p{font-size:12px;line-height:1.9;color:#967185;margin:12px 0 0}
.character-name{font-size:21px;font-weight:600;text-align:center;color:#83516d;margin:10px 0 20px}
.character-detail{background:#fff;border:1px solid #efdee7;border-radius:18px;padding:15px 0 0}

/* 通訊錄卡片：男生頭貼在左，女生頭貼在右。 */
.contact-card.contact-row{display:flex;align-items:center;gap:14px;padding:18px 14px;min-height:136px;text-align:left}
.contact-card.contact-reverse{flex-direction:row-reverse}
.contact-card .contact-portrait{
  width:90px;
  height:110px;
  flex:0 0 90px;
  object-fit:contain;
  border-radius:0;
  display:block;
  margin:0;
  background:transparent;
}
.contact-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:10px}
.contact-card .contact-name{display:block;font-size:19px;font-weight:700;line-height:1.5;color:#80516c;overflow-wrap:anywhere}
.contact-caption{display:block;font-size:11px;line-height:1.8;color:#a17a91}
.contact-reverse .contact-copy{text-align:right}

<body><main class="layout"><section class="stage" aria-label="夢向介紹手機"><div class="case"><span class="charm bow" aria-hidden="true">🎀</span><span class="charm star" aria-hidden="true">✧</span><span class="charm heart" aria-hidden="true">♡</span><div class="strap" aria-hidden="true"></div><div class="screen"><div id="wallpaper" class="wallpaper"></div><div class="island" aria-hidden="true"></div><div class="status"><span id="statusTime">06:15</span><span class="right" aria-label="訊號良好，電量100%">▮▮▮ ϟ ▰</span></div>

<button class="app" data-app="photos"><span class="icon">❀</span>相簿</button><button class="app" data-app="messages"><span class="icon">♡</span>訊息</button><button class="app" data-app="calendar"><span class="icon">▦</span>紀念日</button><button class="app" data-app="settings"><span class="icon">⚙</span>設定</button></div><div class="dock"><button data-app="messages" aria-label="開啟訊息">♡</button><button data-app="photos" aria-label="開啟相簿">❀</button><button id="relock" aria-label="鎖定手機">⏻</button></div></section>
<section id="page" class="view page hidden" aria-label="App 內容"><header class="pagehead"><button class="back" id="back">‹ 返回</button><h2 id="pageTitle"></h2></header><div id="pageBody" class="pagebody"></div></section><button id="home" class="homebar hidden" aria-label="回到主畫面"></button><div id="toast" class="toast hidden" role="status"></div></div></div></section></main>
<script>
// ── 網站主人設定區 ──
// 照片先上傳到 GitHub 同一個資料夾，再在 wallpapers 新增一列。
// 範例：{ id: 'photo1', name: '我們的合照', image: 'wallpaper-01.jpg' },
// id 請使用不同的英文或數字。第一項是新訪客的預設桌布。
const SITE_CONFIG = {
  title: '연애 아이엔지 ⊹ ࣪ ˖ ໒꒱',
  passcode: '0615',
  lockCaption: 'a pocket full of love',
  notificationTitle: '您好！此為<strong><u>《極權教師》賢丹尼爾</u></strong>的夢向設定網站！',
  notificationText: '解鎖手機即可閱覽詳細內容♡',
  homeTitle: 'Dear, you.',
  homeText: '把每一點喜歡，好好收藏。',
  wallpapers: [
    { id: 'pink', name: '粉色夢境', image: '' },
  ],
  // iconImage 留空時使用 symbol；填入圖片檔名即可換成自製 Icon。
  apps: {
    contacts: { name: '通訊錄', symbol: '♙', iconImage: '' },
    notes: { name: '備忘錄', symbol: '☷', iconImage: '' },
    photos: { name: '相簿', symbol: '❀', iconImage: '' },
    messages: { name: '訊息', symbol: '♡', iconImage: '' },
    calendar: { name: '紀念日', symbol: '▦', iconImage: '' },
    settings: { name: '設定', symbol: '⚙', iconImage: '' },
  },
};
// 各 App 的內文在下方 const pages 區塊修改。
// 手機外框、顏色與裝飾在上方 <style> 的 .case、.screen、.charm 修改。
const PASSCODE = SITE_CONFIG.passcode;
const $ = id => document.getElementById(id);
let entered = '', unlocked = false, current = 'lock', toastTimer;
let wallpaperId = SITE_CONFIG.wallpapers[0].id;
try {
  const saved = localStorage.getItem('dream-phone-wallpaper-choice-v2');
  if (SITE_CONFIG.wallpapers.some(w => w.id === saved)) wallpaperId = saved;
} catch {}
function setBackground(element, value) { element.style.backgroundImage = value ? 'url(' + JSON.stringify(value) + ')' : ''; }
function applyWallpaper() {
  const selected = SITE_CONFIG.wallpapers.find(w => w.id === wallpaperId) || SITE_CONFIG.wallpapers[0];
  setBackground($('wallpaper'), selected.image);
  if ($('wallPreview')) setBackground($('wallPreview'), selected.image);
  document.querySelectorAll('[data-wallpaper]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.wallpaper===selected.id)));
}
function chooseWallpaper(id) {
  if (!SITE_CONFIG.wallpapers.some(w=>w.id===id)) return;
  wallpaperId=id; applyWallpaper();
  let message='已套用桌布，下次開啟時會記住你的選擇。';
  try { localStorage.setItem('dream-phone-wallpaper-choice-v2', id); }
  catch { message='已套用桌布；此瀏覽器無法儲存，下次開啟將恢復預設。'; }
  $('settingStatus').textContent=message;
}
function renderWallpaperChoices() {
  const list=$('wallOptions');
  SITE_CONFIG.wallpapers.forEach(w=>{
    const button=document.createElement('button');button.className='wall-choice';button.dataset.wallpaper=w.id;
    button.setAttribute('aria-pressed',String(w.id===wallpaperId));
    const thumb=document.createElement('span');thumb.className='wall-thumb';setBackground(thumb,w.image);
    const label=document.createElement('span');label.className='wall-name';label.textContent=w.name;
    button.append(thumb,label);button.onclick=()=>chooseWallpaper(w.id);list.append(button);
  });
  applyWallpaper();
}
function show(view) { for (const id of ['lock','pin','desktop','page']) $(id).classList.toggle('hidden',id!==view); current=view; $('home').classList.toggle('hidden',!unlocked); }
function toast(message) { $('toast').textContent=message; $('toast').classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3800); }
function updateDots() { [...$('dots').children].forEach((dot,i)=>dot.classList.toggle('filled',i<entered.length)); $('dots').setAttribute('aria-label','已輸入'+entered.length+'位數'); }
function digit(value) { if(current!=='pin'||entered.length>=4)return; entered+=value; updateDots(); if(entered.length===4){ if(entered===PASSCODE){ unlocked=true; entered=''; updateDots(); show('desktop'); }else{ $('pinMessage').textContent='密碼不對，再試一次'; $('dots').classList.add('error'); setTimeout(()=>{entered='';updateDots();$('dots').classList.remove('error');},520); } } }
const letters=['','','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
for(const num of [1,2,3,4,5,6,7,8,9,0]){ const b=document.createElement('button');b.className='key';b.textContent=num;b.setAttribute('aria-label',String(num));if(num===0)b.style.gridColumn='2';const s=document.createElement('small');s.textContent=letters[num]||'\u00a0';b.append(s);b.onclick=()=>digit(String(num));$('keys').append(b); }
$('unlock').onclick=()=>{entered='';updateDots();$('pinMessage').textContent='解開屬於我們的小小世界';show('pin');};
$('cancelPin').onclick=()=>{entered='';updateDots();show('lock');};$('deletePin').onclick=()=>{entered=entered.slice(0,-1);updateDots();};
let currentApp='';
function goHome(){if(unlocked){currentApp='';show('desktop');} }
$('back').onclick=()=>{if(currentApp==='characterMale'||currentApp==='characterFemale')openApp('contacts');else goHome();};
$('home').onclick=goHome;
$('relock').onclick=()=>{unlocked=false;entered='';updateDots();show('lock');};
document.addEventListener('keydown',e=>{if(current!=='pin')return;if(/^\d$/.test(e.key)){e.preventDefault();digit(e.key);}if(e.key==='Backspace'){e.preventDefault();entered=entered.slice(0,-1);updateDots();}if(e.key==='Escape')$('cancelPin').click();});

function openApp(id){ if(!unlocked||!pages[id])return;currentApp=id;const p=pages[id];$('back').textContent=(id==='characterMale'||id==='characterFemale')?'‹ 通訊錄':'‹ 返回';$('pageTitle').textContent=SITE_CONFIG.apps[id]?.name||p.title;$('pageBody').innerHTML=p.html;show('page');$('page').scrollTop=0;if(id==='settings')renderWallpaperChoices();if(id==='contacts')$('pageBody').querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>openApp(b.dataset.character)); }
document.querySelectorAll('[data-app]').forEach(b=>{
  const config=SITE_CONFIG.apps[b.dataset.app];
  if(config){
    const icon=b.querySelector('.icon');
    if(icon){
      if(config.iconImage){const image=document.createElement('img');image.src=config.iconImage;image.alt='';icon.replaceChildren(image);}else icon.textContent=config.symbol;
      b.lastChild.textContent=config.name;
    }else{if(config.iconImage){const image=document.createElement('img');image.src=config.iconImage;image.alt='';image.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:inherit';b.replaceChildren(image);}else b.textContent=config.symbol;b.setAttribute('aria-label','開啟'+config.name);}
  }
  b.onclick=()=>openApp(b.dataset.app);
});
document.title=SITE_CONFIG.title;
document.querySelector('.lock-caption').textContent=SITE_CONFIG.lockCaption;
document.querySelector('.notice strong').innerHTML = SITE_CONFIG.notificationTitle;
document.querySelector('.notice p').innerHTML = SITE_CONFIG.notificationText;
document.querySelector('.widget h2').textContent=SITE_CONFIG.homeTitle;
document.querySelector('.widget p').textContent=SITE_CONFIG.homeText;
