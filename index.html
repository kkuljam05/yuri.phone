/* 備忘錄：兩份相同格式的角色資料，可點標題收合。 */
.character-note{border:1px solid #ead6e2;border-radius:18px;background:#fff;margin:14px 0;overflow:hidden}
.note-content{padding:2px 16px 20px}.note-content h3{font-size:14px;font-weight:700;color:#895a74;letter-spacing:1px;border-bottom:1px solid #efdee7;padding-bottom:9px;margin:24px 0 13px}
.note-content p{font-size:13px;line-height:1.6;color:#765a6a;overflow-wrap:anywhere;margin:0 0 15px}
.note-content p:last-child{margin-bottom:0}.profile-list{list-style:none;padding:0;margin:0;color:#765a6a;font-size:13px;line-height:1.6}
.profile-list li{margin:4px 0}.profile-list strong{font-weight:600;color:#80566f}

/* 通訊錄列表：點卡片開啟獨立的角色詳情。 */
.contact-card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.contact-card:hover{background:#fffafd;border-color:#c992b2}.contact-card:active{background:#f9edf5}
.contact-card .avatar{margin:5px auto 15px}.contact-card strong{font-size:13px;font-weight:500}
.contact-card p{font-size:12px;line-height:1.6;color:#967185;margin:12px 0 0}
.character-name{font-size:21px;font-weight:600;text-align:center;color:#83516d;margin:10px 0 20px}
.character-detail{background:#fff;border:1px solid #efdee7;border-radius:18px;padding:15px 0 0}

/* 通訊錄卡片：男生頭貼在左，女生頭貼在右。 */

.contact-card.contact-reverse{flex-direction:row-reverse}
.contact-card .contact-portrait{
  width:90px;
  height:110px;
  flex:0 0 90px;
  object-fit:contain;
  border-radius:0;
  display:block;
  margin:0;
  background:transparent;
}
.contact-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:10px}
.contact-card .contact-name{display:block;font-size:19px;font-weight:700;line-height:1.6;color:#80516c;overflow-wrap:anywhere}
.contact-caption{display:block;font-size:11px;line-height:1.6;color:#a17a91}
.contact-reverse .contact-copy{text-align:right}

/* 備忘錄各分類直接閱讀：同頁以標題區分段落。 */
.note-reading-section+.note-reading-section{margin-top:28px}
.note-reading-section h3{font-size:14px;font-weight:700;line-height:1.6;color:#895a74;border-bottom:1px solid #efdee7;padding-bottom:9px;margin:20px 0 12px}
.light-text{
  color:#b99aaa;
}
/* 相遇正文預設收合，提示文字保留於外。 */
.meeting-fold>summary{display:flex;align-items:center;justify-content:flex-start;gap:5px;cursor:pointer;list-style:none;color:#765a6a;font-size:13px;font-weight:400;line-height:1.6;padding:0}
.meeting-fold>summary::-webkit-details-marker{display:none}
.meeting-arrow{display:inline-block;color:#b78ba4;font-size:20px;transition:transform .2s}
.meeting-fold[open]>summary .meeting-arrow{transform:rotate(90deg)}
.meeting-fold>summary:focus-visible{outline:2px solid #be8ca8;outline-offset:4px;border-radius:4px}
.reading-sheet .entry-paragraph.meeting-hint{line-height:1.6;margin:6px 0 4px}
.meeting-fold>summary{line-height:1.6}
.reading-sheet .meeting-fold > .entry-paragraph:first-of-type{margin-top:6px}
.timeline-title{text-decoration:underline;text-underline-offset:3px}
.timeline-item + .timeline-item{margin-top:6px}
.reading-sheet .names-section .entry-paragraph{margin:0}.reading-sheet .names-section .entry-paragraph + .entry-paragraph{margin-top:6px}
/* 手機內頁捲軸：細版藕粉色與淡粉色軌道。 */
.page{scrollbar-width:thin;scrollbar-color:#c391ad #f7eaf2}
@supports selector(::-webkit-scrollbar){
  .page{scrollbar-width:auto}
  .page::-webkit-scrollbar{width:6px;height:6px}
  .page::-webkit-scrollbar-track{background:#f7eaf2;border-radius:999px}
  .page::-webkit-scrollbar-thumb{background:#c391ad;border-radius:999px;border:1px solid #f7eaf2}
  .page::-webkit-scrollbar-thumb:hover{background:#ad7595}
  .page::-webkit-scrollbar-button{display:none;width:0;height:0}
  .page::-webkit-scrollbar-corner{background:#f7eaf2}
}
.calendar-toolbar button{display:flex;align-items:center;justify-content:center;padding:0;line-height:1;flex:0 0 33px}
.calendar-toolbar button svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 固定造型的 SVG 蝴蝶結，跨裝置不使用 Emoji。 */
.bow{display:block;right:-20px;top:51px;width:62px;height:56px;font-size:0;transform:rotate(15deg)}
.bow svg{display:block;width:100%;height:100%}
.thought-perspective h4{text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:700;line-height:1.6;color:#895a74;margin:14px 0 6px}
.reading-sheet .thought-perspective .entry-paragraph{margin:0 0 10px}
.reading-sheet .thought-perspective .entry-paragraph:last-child{margin-bottom:0}
.thought-perspective + .thought-perspective{margin-top:12px;padding-top:0}
/* 內頁背景延伸至螢幕底部，避免露出桌布色帶。 */
.page,.pin{bottom:0}
.anniversary-timer{font-family:"Parisienne","Monotype Corsiva","Segoe Script",cursive;gap:2px;flex-wrap:nowrap;white-space:nowrap;line-height:1.4}
.anniversary-timer strong{font-family:inherit;font-size:21px;font-weight:400}
.anniversary-timer small{font-family:inherit;font-size:12px;margin-right:2px}

/* 固定日曆排版，只縮小下方留白。 */
.pagebody:has(.calendar-content){padding-bottom:18px}
.calendar-content .date-events{padding-bottom:4px}
.calendar-content .date-events h3{margin:8px 0 5px}
.calendar-content .date-events .content-empty{margin:5px 0 8px}
/* 所有日期共用較緊湊的月曆，為註記保留空間。 */
.pagebody:has(.calendar-content){padding-top:12px}
.calendar-content .calendar-toolbar{margin-top:0;margin-bottom:8px}
.calendar-content .weekdays{margin-bottom:5px}
.calendar-content .calendar-grid{gap:2px 1px}
.calendar-content .calendar-day{height:34px;font-size:13px;padding:0 0 8px;line-height:1}
.calendar-content .calendar-day i{bottom:2px}
/* 預設桌布：白底、交錯排列的粉紅波點。 */
.wallpaper.default-wallpaper{background-color:#fff; background-image:radial-gradient(circle,#f7dfeb 2px,transparent 2.5px),radial-gradient(circle,#f7dfeb 2px,transparent 2.5px);background-size:28px 28px;background-position:0 0,14px 14px}
.wallpaper.default-wallpaper:after{background:none}

settings:{title:'閱前須知',html:'<article class="reading-sheet"><div class="tag">BEFORE YOU READ</div><h2>閱前須知</h2><p class="entry-paragraph">您好！感謝您的點閱♡ 此為<strong>《極權教師》賢丹尼爾</strong>的夢向設定網站！</p><p class="entry-paragraph">以下包含少量人物背景劇透及大量私設，若有任何苦手元素請直接關閉此網站，謝謝🤲🏻</p><section class="note-reading-section"><h3>版權聲明</h3><p class="entry-paragraph">本網站為個人同人創作網站，與原作作者、出版社及官方無關。原作《極權教師》及其角色、世界觀等相關權利，均歸原作者與各權利人所有。</p><p class="entry-paragraph">網站內的文字與設定，未經同意請勿轉載、修改或挪作他用；站內使用的圖片皆為個人委託或朋友贈圖，相關權利歸各自創作者或權利人所有，請勿擅自使用、轉載、修改或挪作他用。</p></section></article>'},
characterMale: {title:"賢丹尼爾", html:`<article class="character-detail"><div class="profile-art"><img class="character-profile-avatar" src="avatar-male.png" alt="賢丹尼爾的頭貼" width="112" height="112"><span class="artist-credit">ⓒ 햄양 님</span></div><div class="note-content">
<h3>基本資料</h3>
<ul class="profile-list">
<li>・姓名：賢丹尼爾</li>
<li>・性別：男</li>
<li>・國籍：美國（韓美混血）</li>
<li>・年齡：22～25歲（私設）</li>
<li>・身高：185公分（私設）</li>
<li>・職業：教權保護局監察員</li>
</ul>

<h3>外貌</h3>
<p>端正帥氣，或許是因為混血，長相格外精緻俊美。</p>
<p>淺灰褐色的中分短髮，頭髮末端有些向外翹起，後腦勺下半的頭髮推得較平。</p>
<p>眼眸是明亮鮮豔的薄荷綠，眼型平直而整體上挑，在原作中是少數有特別畫出上下睫毛的男性角色。平時都戴著一副圓角眼鏡。</p>
<p>身段頎長，體格並不特別壯碩，但擁有可以輕易制伏格鬥選手的力量，猜測大概屬於穿衣顯瘦的類型。</p>

<h3>性格</h3>
<p>溫和沉著，情緒穩定，絕大多數時候都能保持冷靜，能設想到各種突發狀況並隨時做好充足的準備，周身散發著可靠的氣場，從各方面來看都是三好青年。</p>
<p>與教權局其他人不同，反對以暴制暴，但並不是和平主義者，而是認為心靈層面的教訓能帶給人更深刻的影響，因此幾乎不會與人動手，頂多是制伏主動攻擊的對象。</p>
<p>頭腦聰明、心思縝密，擅長默默佈局後等待對方主動掉進陷阱。即使加害者最終會因為自己的計謀落得非常悲慘的下場，也不會有絲毫同情或動搖；有時理智的程度會讓人感覺稍微缺乏人性，但絕對不是性格惡劣的人。</p>
<p>在與人的交際上顯得比較被動，除了同事之外大概沒什麼朋友……並沒有排斥或討厭社交，只是不會主動談論工作外的私事，若有人找他搭話或聊天也不會拒絕，是好相處的人。</p>
<p>雖說是個認真的人，但也隱約有著惡趣味的一面，言詞偶爾會比較尖銳，或是做出一些壞心眼的事。因為總是面無表情，令人無從分別究竟是無自覺的腹黑還是有意為之。</p>

<h3>背景</h3>
<p>從小生活在美國貧民窟，父親是家暴慣犯，長期對兒時的賢和母親施暴，賢也因此對他的父親痛恨至極。</p>
<p>在某次幾乎要鬧出人命的施暴中，忍無可忍的賢對父親開了槍，雖然並未造成死亡，然而，母親卻因為年幼的兒子竟然能做出這樣的事，認定他與父親沒有兩樣，最終選擇拋棄他。此後，賢被黑幫組織帶走，被培養成黑手黨的殺手，直到組織倒台，他才回到韓國，應徵了教權局的工作。</p>
<p>賢的童年與青少年時期幾乎都在暴力與惡意之中度過，他始終在想，如果當時沒有開出那一槍，事情是否會有不同的結果？也因此他反對以單純的肢體暴力解決問題，試圖尋找其他解決問題的方法，加入教權局，也是希望能透過這份工作探求心中的答案。</p>
</div></article>`},
characterFemale: {title:"都瑠璃", html:`<article class="character-detail"><div class="profile-art"><img class="character-profile-avatar" src="avatar-female.png" alt="都瑠璃的頭貼" width="112" height="112"><span class="artist-credit">ⓒ 햄양 님</span></div><div class="note-content">
<h3>基本資料</h3>
<ul class="profile-list">
<li>・姓名：都瑠璃</li>
<li>・性別：女</li>
<li>・國籍：韓國</li>
<li>・年齡：17歲</li>
<li>・身高：168公分</li>
<li>・職業：學生（高中生）</li>
</ul>

<h3>外貌</h3>
<p>長相可愛之中帶了一點稚氣，會在意外表的女孩子</p>
<p>有著一頭微捲的粉色長髮，髮尾處漸層紫色。左側的頭髮綁成了蝴蝶結形狀。</p>
<p>湖水藍的眼睛大而圓潤，僅在眼尾處微微上揚。左臉頰中央有一顆痣。</p>
<p>身材纖細，但胸部和肚子是稍微有肉一點的類型，雖然想下定決心減肥，卻總是抵不過甜點的誘惑。</p>

<div class="outfit-drawings">
<details class="meeting-fold timeline-item outfit-fold"><summary><span class="meeting-arrow" aria-hidden="true">▸</span><span class="timeline-title">常服</span></summary><figure class="outfit-art"><button type="button" class="outfit-enlarge" aria-label="放大都瑠璃的常服立繪"><img src="ruri-casual.png" alt="都瑠璃的常服立繪" loading="lazy"></button><figcaption class="artist-credit">ⓒ 어푸 님</figcaption></figure></details>
<details class="meeting-fold timeline-item outfit-fold"><summary><span class="meeting-arrow" aria-hidden="true">▸</span><span class="timeline-title">制服</span></summary><figure class="outfit-art"><button type="button" class="outfit-enlarge" aria-label="放大都瑠璃的制服立繪"><img src="ruri-uniform.png" alt="都瑠璃的制服立繪" loading="lazy"></button><figcaption class="artist-credit">ⓒ 路燈</figcaption></figure></details>
</div>
<h3>性格</h3>
<p>活潑外向又吵鬧，情感表現豐富，說話的語氣充滿了驚嘆號，甚至到了有點聒噪的地步……不過因為很可愛<span class="light-text">（應該吧？）</span>，所以並不惹人討厭。</p>
<p>直來直往，一根筋的笨蛋，喜怒哀樂都十分明顯。從小到大都無憂無慮地生活著，缺乏識別危險的能力，習慣以善意對待一切。做事不拘小節又缺乏規劃，也因此看上去冒冒失失的（天然呆……）。腦迴路異於常人。有點電波系，經常做出令人意想不到的舉動，事後又會自己感到難以為情。</p>
<p>成績不好，不喜歡也不擅長讀書，每天到學校就是開開心心跟朋友玩，上課睡覺或是在課本上畫畫、偷滑手機……喜歡打扮自己，所以會染頭髮和改制服，不能算是標準的好學生，但也沒有做過出格的事情。</p>
<p>充滿少女心，對於浪漫的戀愛一事抱有憧憬，面對喜歡的對象會主動出擊，也只有在這種時候會多出一些笨拙的小心機，例如故意裝哭、裝可憐等，想吸引對方注意。（當然，還是一眼就看出來是在演戲了……反倒令人啼笑皆非。）但說到底，她也只是個情竇初開的十七歲少女，面對心上人時仍容易感到慌張害羞。</p>

<h3>背景</h3>
<p>(還沒寫)</p>
</div></article>`},

const escapeHTML = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(value){try{const u=new URL(value,location.href);return ['https:','http:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function imageURL(value){if(!value)return '';try{const u=new URL(value,location.href);return ['https:','http:','file:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function paragraphs(items){
  if(!items?.length){
    return '<p class="content-empty">內容準備中，故事會慢慢補上。</p>';
  }
  return items.map(p=>{
    const text=escapeHTML(p)
      .replace(/&lt;(\/?)(strong|b|em|i|u|s)&gt;/gi,'<$1$2>')
      .replace(/&lt;br\s*\/?&gt;/gi,'<br>')
.replaceAll('&lt;span class=&quot;light-text&quot;&gt;','<span class="light-text">')
.replaceAll('&lt;/span&gt;','</span>');
    return '<p class="entry-paragraph">'+text+'</p>';
  }).join('');
}
function outgoing(url,label){const href=url&&safeURL(url);return href?'<a class="external-link" href="'+escapeHTML(href)+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(label)+' ↗</a>':'';}
function emptyMessage(symbol,title,text){return '<div class="content-blank"><span aria-hidden="true">'+symbol+'</span><h3>'+escapeHTML(title)+'</h3><p>'+escapeHTML(text)+'</p></div>';}
function tapCard(kind,index,title,subtitle,symbol){return '<button type="button" class="entry-card" data-entry="'+kind+'" data-index="'+index+'"><span class="entry-symbol" aria-hidden="true">'+symbol+'</span><span><strong>'+escapeHTML(title)+'</strong><small>'+escapeHTML(subtitle)+'</small></span><span class="entry-arrow" aria-hidden="true">›</span></button>';}

        '現階段仍是瑠璃一廂情願的單戀，但她顯然不打算就此止步！至於這份鍥而不捨的愛慕之心，未來是否有機會得到回應，或許就只能交給時間證明了……！'

  const cards=visible.map(({w,i})=>{const img=imageURL(w.images?.[0]);return '<button class="work-card" type="button" data-work="'+i+'">'+(img?'<img class="work-cover" src="'+escapeHTML(img)+'" alt="'+escapeHTML(w.title)+'" loading="lazy">':'<div class="text-cover" aria-hidden="true">☷</div>')+'<span class="work-copy"><strong>'+escapeHTML(w.title)+'</strong><span class="work-excerpt">'+escapeHTML(w.paragraphs?.[0]||'點擊查看完整作品')+'</span><small>'+escapeHTML((w.tags||[]).map(t=>'#'+t).join(' '))+'</small></span></button>';}).join('');

  const imgs=(w.images||[]).map(imageURL).filter(Boolean);
  const gallery=imgs.length?'<button type="button" class="image-open" id="viewFullImage" aria-label="放大圖片"><img id="workImage" class="work-image" src="'+escapeHTML(imgs[0])+'" alt="'+escapeHTML(w.title)+'"></button>'+(imgs.length>1?'<div class="image-nav"><button id="prevWorkImage" aria-label="上一張圖片">‹</button><span id="imageCount">1 / '+imgs.length+'</span><button id="nextWorkImage" aria-label="下一張圖片">›</button></div>':''):'';
  featurePage('photos',w.title,'<article class="work-detail">'+gallery+'<div class="reading-sheet"><div class="work-tags">'+escapeHTML((w.tags||[]).map(t=>'#'+t).join(' '))+'</div><h2>'+escapeHTML(w.title)+'</h2>'+(w.date?'<p class="work-date">'+escapeHTML(w.date)+'</p>':'')+paragraphs(w.paragraphs)+(w.credit?'<p class="work-credit">繪師／'+escapeHTML(w.credit)+'</p>':'')+outgoing(w.url,'前往原文')+'</div></article>','‹ 相簿');
  if(imgs.length){
    const cycle=delta=>{selectedWorkImage=(selectedWorkImage+delta+imgs.length)%imgs.length;$('workImage').src=imgs[selectedWorkImage];$('imageCount').textContent=(selectedWorkImage+1)+' / '+imgs.length;};
    if(imgs.length>1){$('prevWorkImage').onclick=()=>cycle(-1);$('nextWorkImage').onclick=()=>cycle(1);}
    $('viewFullImage').onclick=()=>{
      const overlay=document.createElement('div');overlay.className='image-modal';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','作品大圖');
      overlay.innerHTML='<button type="button" class="close-image" aria-label="關閉大圖">×</button><img src="'+escapeHTML(imgs[selectedWorkImage])+'" alt="'+escapeHTML(w.title)+'">';
      const previous=document.activeElement;const close=()=>{overlay.remove();previous?.focus();document.removeEventListener('keydown',key);};
      const key=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();overlay.querySelector('button').focus();}};
      overlay.onclick=e=>{if(e.target===overlay)close();};overlay.querySelector('button').onclick=close;document.addEventListener('keydown',key);document.body.append(overlay);overlay.querySelector('button').focus();
    };
  }
}
function renderChat(){
  featureState={app:'messages',view:'chat',index:null};const chat=CONTENT.chat;
  const bubbles=chat.messages.map(m=>'<div class="chat-line '+(m.side==='me'?'chat-me':'chat-other')+'"><div class="chat-bubble">'+escapeHTML(m.text)+'</div>'+(m.time?'<time>'+escapeHTML(m.time)+'</time>':'')+'</div>').join('');
  featurePage('messages',SITE_CONFIG.apps.messages.name,'<div class="chat-top"><span aria-hidden="true">♡</span><div><strong>'+escapeHTML(chat.title)+'</strong><small>'+escapeHTML(chat.subtitle)+'</small></div></div><div class="chat-transcript">'+(bubbles||emptyMessage('♡','對話準備中','屬於兩人的訊息，之後會出現在這裡。'))+'</div><div class="chat-footer">♡ 收藏的一段對話</div>');
}
function taipeiToday(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const part=t=>parts.find(p=>p.type===t).value;return part('year')+'-'+part('month')+'-'+part('day');}
const initialDate=taipeiToday();let calendarYear=Number(initialDate.slice(0,4)),calendarMonth=Number(initialDate.slice(5,7))-1,selectedDate=initialDate;
function dateKey(year,month,day){return year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');}
function anniversaryTitle(year){
  const number=year-Number(CONTENT.events.find(e=>e.anniversary).date.slice(0,4)), labels=['','一','兩','三','四','五','六','七','八','九'];
  return (labels[number]||String(number))+'周年';
}
function eventsForDate(key){
  const events=CONTENT.events.filter(e=>e.annual?key.slice(5)===e.date.slice(5)&&key>=e.date:e.date===key).map(e=>{
    if(!e.anniversary||key.slice(0,4)===e.date.slice(0,4))return e;
    return {...e,title:anniversaryTitle(Number(key.slice(0,4))),description:'和賢先生一起度過 '+(Number(key.slice(0,4))-Number(e.date.slice(0,4)))+' 年了♡'};
  });
  const day=dayNumberForDate(key),interval=CONTENT.milestoneEvery;
  if(Number.isInteger(interval)&&interval>0&&day>0&&day%interval===0){
    events.push({id:'milestone-'+day,date:key,annual:false,title:'第 '+day+' 天紀念日',description:'和賢先生一起度過的第 '+day+' 天♡',url:''});
  }
  return events;
}
// 依台灣日期計算第幾天，起始日就是第 1 天。
function dayNumberForDate(key){
  const midnight=Date.parse(key+'T00:00:00+08:00');
  const firstMidnight=Date.parse(CONTENT.startAt.slice(0,10)+'T00:00:00+08:00');
  return Math.floor((midnight-firstMidnight)/86400000)+1;
}
function elapsedParts(now=Date.now()){
  const total=Math.max(0,Math.floor((now-new Date(CONTENT.startAt).getTime())/1000));
  return {days:now>=new Date(CONTENT.startAt).getTime()?Math.floor(total/86400)+1:0,hours:Math.floor(total/3600)%24,minutes:Math.floor(total/60)%60,seconds:total%60};
}
function updateAnniversary(){const el=$('anniversaryTimer');if(!el)return;const p=elapsedParts();el.innerHTML='<strong>'+p.days+'</strong><small>days</small><strong>'+String(p.hours).padStart(2,'0')+'</strong><small>hrs</small><strong>'+String(p.minutes).padStart(2,'0')+'</strong><small>min</small><strong>'+String(p.seconds).padStart(2,'0')+'</strong><small>sec</small>';el.setAttribute('aria-label',p.days+'天'+p.hours+'小時'+p.minutes+'分鐘'+p.seconds+'秒');}
function renderEventList(){
  const events=eventsForDate(selectedDate);
  $('dateEvents').hidden=events.length===0;
  $('dateEvents').innerHTML='<h3>'+escapeHTML(selectedDate.replaceAll('-',' / '))+'</h3>'+(events.length?events.map(e=>'<article class="date-event"><strong>'+escapeHTML(e.title)+'</strong>'+(e.description?'<p>'+escapeHTML(e.description)+'</p>':'')+outgoing(e.url,'看這天的慶祝圖文')+'</article>').join(''):'<p class="content-empty">這一天沒有特別註記。</p>');
}
function upcomingDates(){
  const today=taipeiToday(),base=Date.parse(today+'T00:00:00Z'),items=[];
  for(let offset=0;offset<=3660 && items.length<1;offset++){
    const key=new Date(base+offset*86400000).toISOString().slice(0,10);
    for(const event of eventsForDate(key)){
      items.push({date:key,title:event.title,days:offset});
      if(items.length===1)break;
    }
  }
  return items;
}
function renderUpcomingDates(){
  const target=$('upcomingDates');if(!target)return;
  const items=upcomingDates();
  target.innerHTML='<h3>即將到來的日子</h3>'+items.map(item=>'<button type="button" class="upcoming-date" data-upcoming="'+item.date+'"><span><time>'+item.date.replaceAll('-',' / ')+'</time><strong>'+escapeHTML(item.title)+'</strong></span><small>'+(item.days===0?'就是今天':'還有 '+item.days+' 天')+' <span aria-hidden="true">›</span></small></button>').join('');
  target.querySelectorAll('[data-upcoming]').forEach(button=>button.onclick=()=>{
    selectedDate=button.dataset.upcoming;calendarYear=Number(selectedDate.slice(0,4));calendarMonth=Number(selectedDate.slice(5,7))-1;renderCalendar();
  });
}
function renderCalendar(){
  featureState={app:'calendar',view:'month',index:null};
  const first=new Date(Date.UTC(calendarYear,calendarMonth,1)).getUTCDay(),days=new Date(Date.UTC(calendarYear,calendarMonth+1,0)).getUTCDate(),today=taipeiToday();
  let cells=Array.from({length:first},()=>'<span aria-hidden="true"></span>').join('');
  for(let day=1;day<=days;day++){
    const key=dateKey(calendarYear,calendarMonth,day),events=eventsForDate(key);
    cells+='<button type="button" class="calendar-day'+(today===key?' is-today':'')+'" data-date="'+key+'" aria-pressed="'+(key===selectedDate)+'" aria-label="'+key+(events.length?'，'+escapeHTML(events.map(e=>e.title).join('、')):'')+'">'+day+(events.length?'<i aria-hidden="true"></i>':'')+'</button>';
  }
  featurePage('calendar',SITE_CONFIG.apps.calendar.name,'<div class="calendar-content"><div class="calendar-toolbar"><button id="previousMonth" aria-label="上個月"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14 6-6 6 6 6"/></svg></button><h2>'+calendarYear+' 年 '+(calendarMonth+1)+' 月</h2><button id="nextMonth" aria-label="下個月"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10 6 6 6-6 6"/></svg></button></div><div class="weekdays" aria-hidden="true">'+['日','一','二','三','四','五','六'].map(d=>'<span>'+d+'</span>').join('')+'</div><div class="calendar-grid" aria-label="日期">'+cells+'</div><section id="dateEvents" class="date-events" aria-live="polite"></section><section id="upcomingDates" class="upcoming-dates" aria-label="即將到來的日子"></section></div>');
  const move=delta=>{const d=new Date(Date.UTC(calendarYear,calendarMonth+delta,1));calendarYear=d.getUTCFullYear();calendarMonth=d.getUTCMonth();selectedDate=dateKey(calendarYear,calendarMonth,1);renderCalendar();};
  $('previousMonth').onclick=()=>move(-1);$('nextMonth').onclick=()=>move(1);
  $('pageBody').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;$('pageBody').querySelectorAll('[data-date]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.date===selectedDate)));renderEventList();});
  renderEventList();renderUpcomingDates();updateAnniversary();
}
const originalOpenApp=openApp;
openApp=function(id){if(!unlocked)return;if(id==='notes'){renderNotes();return;}if(id==='photos'){renderAlbum();return;}if(id==='messages'){renderChat();return;}if(id==='calendar'){renderCalendar();return;}featureState={app:id,view:'list',index:null};originalOpenApp(id);};
$('back').onclick=()=>{
  if(currentApp==='characterMale'||currentApp==='characterFemale'){openApp('contacts');return;}
  if(currentApp==='notes'&&featureState.view!=='home'){renderNotes();return;}
  if(currentApp==='photos'&&featureState.view==='work'){renderAlbum();return;}
  goHome();
};
updateAnniversary();setInterval(updateAnniversary,1000);

// 點擊立繪以大圖檢視。
document.addEventListener('click',event=>{
 const trigger=event.target.closest('.outfit-enlarge');if(!trigger)return;
 const source=trigger.querySelector('img'),dialog=document.createElement('dialog');
 dialog.className='outfit-viewer';dialog.setAttribute('aria-label',source.alt+'大圖');
 const close=document.createElement('button');close.type='button';close.className='close-image';close.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg>';close.setAttribute('aria-label','關閉大圖');
 const picture=document.createElement('img');picture.src=source.src;picture.alt=source.alt;
 dialog.append(close,picture);document.body.append(dialog);
 close.onclick=()=>dialog.close();
 dialog.onclick=e=>{if(e.target===dialog)dialog.close();};
 dialog.addEventListener('close',()=>{dialog.remove();trigger.focus();},{once:true});
 dialog.showModal();close.focus();
});
</script></body></html>
