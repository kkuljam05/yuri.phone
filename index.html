/* 手機置中；外部不放文字或介紹區塊。 */
.layout{display:flex;align-items:center;justify-content:center;gap:0;max-width:none;padding:28px 16px;min-height:100svh}
.stage{flex-shrink:0}.icon img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
@media(max-width:390px){.layout{padding:20px 5px}}

/* 備忘錄：兩份相同格式的角色資料，可點標題收合。 */
.character-note{border:1px solid #ead6e2;border-radius:18px;background:#fff;margin:14px 0;overflow:hidden}
.note-content{padding:2px 16px 20px}.note-content h3{font-size:14px;font-weight:700;color:#895a74;letter-spacing:1px;border-bottom:1px solid #efdee7;padding-bottom:9px;margin:24px 0 13px}
.note-content p{font-size:13px;line-height:1.6;color:#765a6a;overflow-wrap:anywhere;margin:0 0 15px}
.note-content p:last-child{margin-bottom:0}.profile-list{list-style:none;padding:0;margin:0;color:#765a6a;font-size:13px;line-height:1.6}
.profile-list li{margin:4px 0}.profile-list strong{font-weight:600;color:#80566f}

/* 通訊錄列表：點卡片開啟獨立的角色詳情。 */
.contact-card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.contact-card:hover{background:#fffafd;border-color:#c992b2}.contact-card:active{background:#f9edf5}
.contact-card .avatar{margin:5px auto 15px}.contact-card strong{font-size:13px;font-weight:500}
.contact-card p{font-size:12px;line-height:1.6;color:#967185;margin:12px 0 0}
.character-name{font-size:21px;font-weight:600;text-align:center;color:#83516d;margin:10px 0 20px}
.character-detail{background:#fff;border:1px solid #efdee7;border-radius:18px;padding:15px 0 0}

/* 通訊錄卡片：男生頭貼在左，女生頭貼在右。 */
.contact-card.contact-row{display:flex;align-items:center;gap:14px;padding:18px 14px;min-height:136px;text-align:left}
.contact-card.contact-reverse{flex-direction:row-reverse}
.contact-card .contact-portrait{
  width:90px;
  height:110px;
  flex:0 0 90px;
  object-fit:contain;
  border-radius:0;
  display:block;
  margin:0;
  background:transparent;
}
.contact-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:10px}
.contact-card .contact-name{display:block;font-size:19px;font-weight:700;line-height:1.6;color:#80516c;overflow-wrap:anywhere}
.contact-caption{display:block;font-size:11px;line-height:1.6;color:#a17a91}
.contact-reverse .contact-copy{text-align:right}

/* 備忘錄各分類直接閱讀：同頁以標題區分段落。 */
.note-reading-section+.note-reading-section{margin-top:28px}
.note-reading-section h3{font-size:14px;font-weight:700;line-height:1.6;color:#895a74;border-bottom:1px solid #efdee7;padding-bottom:9px;margin:20px 0 12px}
.light-text{
  color:#b99aaa;
}
/* 相遇正文預設收合，提示文字保留於外。 */
.meeting-fold>summary{display:flex;align-items:center;justify-content:flex-start;gap:5px;cursor:pointer;list-style:none;color:#765a6a;font-size:13px;font-weight:400;line-height:1.6;padding:0}
.meeting-fold>summary::-webkit-details-marker{display:none}
.meeting-arrow{display:inline-block;color:#b78ba4;font-size:20px;line-height:1;transition:transform .2s}
.meeting-fold[open]>summary .meeting-arrow{transform:rotate(90deg)}
.meeting-fold>summary:focus-visible{outline:2px solid #be8ca8;outline-offset:4px;border-radius:4px}
.reading-sheet .entry-paragraph.meeting-hint{line-height:1.6;margin:6px 0 4px}
.meeting-fold>summary{line-height:1.6}
.reading-sheet .meeting-fold > .entry-paragraph:first-of-type{margin-top:6px}
.timeline-title{text-decoration:underline;text-underline-offset:3px}
.timeline-item + .timeline-item{margin-top:6px}
.reading-sheet .names-section .entry-paragraph{margin:0}.reading-sheet .names-section .entry-paragraph + .entry-paragraph{margin-top:6px}
/* 手機內頁捲軸：細版藕粉色與淡粉色軌道。 */
.pagebody{scrollbar-width:thin;scrollbar-color:#c391ad #f7eaf2}
@supports selector(::-webkit-scrollbar){
  .pagebody{scrollbar-width:auto}
  .pagebody::-webkit-scrollbar{width:6px;height:6px}
  .pagebody::-webkit-scrollbar-track{background:#f7eaf2;border-radius:999px}
  .pagebody::-webkit-scrollbar-thumb{background:#c391ad;border-radius:999px;border:1px solid #f7eaf2}
  .pagebody::-webkit-scrollbar-thumb:hover{background:#ad7595}
  .pagebody::-webkit-scrollbar-button{display:none;width:0;height:0}
  .pagebody::-webkit-scrollbar-corner{background:#f7eaf2}
}
.calendar-toolbar button{display:flex;align-items:center;justify-content:center;padding:0;line-height:1;flex:0 0 33px}
.calendar-toolbar button svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 固定造型的 SVG 蝴蝶結，跨裝置不使用 Emoji。 */
.bow{display:block;right:-20px;top:51px;width:62px;height:56px;font-size:0;transform:rotate(15deg)}
.bow svg{display:block;width:100%;height:100%}
.thought-perspective h4{text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:700;line-height:1.6;color:#895a74;margin:14px 0 6px}
.reading-sheet .thought-perspective .entry-paragraph{margin:0 0 10px}
.reading-sheet .thought-perspective .entry-paragraph:last-child{margin-bottom:0}
.thought-perspective + .thought-perspective{margin-top:12px;padding-top:0}
/* 內頁背景延伸至螢幕底部，避免露出桌布色帶。 */
.page,.pin{bottom:0}
.anniversary-timer{font-family:"Parisienne","Monotype Corsiva","Segoe Script",cursive;gap:2px;flex-wrap:nowrap;white-space:nowrap;line-height:1.4}
.anniversary-timer strong{font-family:inherit;font-size:21px;font-weight:400}
.anniversary-timer small{font-family:inherit;font-size:12px;margin-right:2px}

/* 固定日曆排版，只縮小下方留白。 */
.pagebody:has(.calendar-content){padding-bottom:18px}
.calendar-content .date-events{padding-bottom:4px}
.calendar-content .date-events h3{margin:8px 0 5px}
.calendar-content .date-events .content-empty{margin:5px 0 8px}
/* 所有日期共用較緊湊的月曆，為註記保留空間。 */
.pagebody:has(.calendar-content){padding-top:12px}
.calendar-content .calendar-toolbar{margin-top:0;margin-bottom:8px}
.calendar-content .weekdays{margin-bottom:5px}
.calendar-content .calendar-grid{gap:2px 1px}
.calendar-content .calendar-day{height:34px;font-size:13px;padding:0 0 8px;line-height:1}
.calendar-content .calendar-day i{bottom:2px}
/* 預設桌布：白底、交錯排列的粉紅波點。 */

settings:{title:'閱前須知',html:'<article class="reading-sheet"><div class="tag">BEFORE YOU READ</div><h2>閱前須知</h2><p class="entry-paragraph">您好！感謝您的點閱♡<br>此為<strong>《極權教師》賢丹尼爾</strong>的夢向網站。</p><figure class="meeting-art"><img src="welcome.png" alt="賢與瑠璃的可愛雙人插圖" loading="lazy"><figcaption class="artist-credit">ⓒ Yuz 님</figcaption></figure><p class="entry-paragraph">本網站內包含少量的人物背景劇透及大量私設，若在閱讀過程中有任何苦手元素請直接關閉網站，謝謝🤲🏻</p><section class="note-reading-section"><h3>網站導覽</h3><ul class="site-guide-list"><li><strong>通訊錄｜角色介紹</strong><br>賢與瑠璃的個人資料、外貌、性格、背景及TMI。</li><li><strong>備忘錄｜人物關係</strong><br>故事的世界觀、兩人的相遇與互動，以及不同設定的PARO。</li><li><strong>相簿｜圖文展示</strong><br>收藏兩人的圖片與文字作品，可依分類瀏覽。</li><li><strong>訊息｜對話彩蛋</strong><br>記錄賢與瑠璃之間的訊息與通話片段。</li><li><strong>日曆｜節日紀念</strong><br>查看節日與紀念日，點擊有底線的標題即可前往當天的圖文。</li></ul><p class="entry-paragraph">另外，網站內的箭頭（▸）都可以點擊，以展開或收合內容唷！</p></section><section class="note-reading-section"><h3>版權聲明</h3><p class="entry-paragraph">本網站為個人同人創作網站，與原作作者、出版社及官方無關。原作《極權教師》及其角色、世界觀等相關權利，均歸原作者與各權利人所有。</p><p class="entry-paragraph">網站內的文字與設定，未經同意請勿轉載、修改或挪作他用；站內使用的圖片皆為個人委託或朋友贈圖，相關權利歸各自創作者或權利人所有，請勿擅自使用、轉載、修改或挪作他用。</p></section></article>'},
characterMale: {title:"賢丹尼爾", html:`<article class="character-detail"><div class="profile-art"><img class="character-profile-avatar" src="avatar-male.png" alt="賢丹尼爾的頭貼" width="112" height="112"><span class="artist-credit">ⓒ 햄양 님</span></div><div class="note-content">

<p>端正帥氣，或許是因為混血，長相格外精緻俊美。</p>
<p>淺灰褐色的中分短髮，頭髮末端有些向外翹起，後腦勺下半的頭髮推得較平。</p>

<h3>背景</h3>

    {"id":"summer-watermelon","title":"","date":"","images":["album-watermelon.png"],"paragraphs":["여름의 맛 ‪𓂃 𓈒𓏸 🍉","","　　「賢先生！」","　　都瑠璃抱著一顆比她的頭還要大了一圈的西瓜，站在賢丹尼爾的住處外，勉強騰出一隻手敲了敲門，扯著嗓子又喊了一次：「賢先生──！」","　　屋內那側很快傳來了門把扭動的聲音，賢的身影出現在門後，視線從少女毫不掩飾期待的臉龐向下移，最終停在她懷裡的西瓜上，「這是……」","　　「賢先生！這是西瓜！」瑠璃獻寶似地回道。她本想把西瓜舉起展示，卻因重量太沉而只得作罷，轉為用亮晶晶的眼神攻勢以表誠意：「今天剛寄來的，很新鮮喔！但是呀，媽媽不小心買太多了，我們家三個人吃不完，所以想說分給賢先生一顆！」她楚楚可憐地眨了眨眸，「賢先生，你會收下的吧？」","　　答案早已不言而喻。","　　賢伸手接過那顆西瓜，方才壓得瑠璃雙臂發酸的巨大西瓜，到了他手上像是倏地輕了幾斤。看著賢面不改色地以單手托著西瓜，瑠璃眼冒愛心地感歎：「賢先生好帥氣喔……」","　　賢沉默半晌，乾脆忽略這句話，拋出一個令瑠璃措手不及的問題──「不過，這麼大的西瓜我一個人也吃不完。瑠璃，等等有空嗎？」","　　「咦？」","　　賢微微側過身，讓出通往玄關的空間，「要進來嗎？我把西瓜切一切，一起吃吧。」","　　「咦咦咦──！什麼、欸、可以嗎？」瑠璃瞬間瞪大了眼睛，莫名慌慌張張地解釋了起來，險些咬到舌頭，「那個……我、我不是抱持著這樣的心思才來給賢先生送西瓜的喔！是、是有想過搞不好可以跟賢先生多說幾句話之類的啦……但但但是進到賢先生家裡這種好事，真的可以嗎……？」","　　「如果不想要的話，當然不會勉強妳。」","　　「什麼呀！我剛剛說的話像是不想要的意思嗎？」瑠璃急忙抓住賢的手腕，語氣懇切：「我想要、超級想要！請務必讓我進去賢先生的家裡！」","　　賢鏡片後的雙眼終於難得地浮出一絲笑意。","　　「進來吧。」","","　　瑠璃小心翼翼地踏入玄關，好奇地四處探頭探腦。賢先生的家和他本人一樣整潔俐落，雖然──環顧四周，所見之處僅有寥寥幾件必要家具，瑠璃不禁小聲嘀咕──有點乾淨過頭了啦……還以為可以看到賢先生比較不一樣的一面。","　　儘管賢說了讓瑠璃坐在客廳等著就好，她仍主動跟到了流理台邊──當然是一點忙也沒幫上，只負責在賢處理西瓜時，不間斷地嘰嘰喳喳著。","　　「賢先生！你的家裡好空……不是，好整齊喔！」\n　　「賢先生──你會自己煮飯嗎？廚具看起來好新！」\n　　「賢先生，平時你都在做什麼呀？不會無聊嗎？」","　　賢平淡地逐一回覆：嗯、偶爾、還好、不會。","　　當他將西瓜切成了薄片，正要放到一旁時，瑠璃忽然大聲驚呼：「等一下，西瓜切得太小片了吧！賢先生這麼高，應該要多吃一點呀！再說了……西瓜就是要大口吃才過癮嘛！」","　　……最終，賢自己拿了那一小片西瓜，並按照瑠璃的指示，切了近四分之一個西瓜分給她。瑠璃小小的手捧著偌大的西瓜，畫面顯得有些滑稽，不過瑠璃倒是十分高興地享用了起來。","　　賢看著她心滿意足的樣子，跟著咬下一口。西瓜鮮甜多汁，驅散了幾分夏日的燠熱暑氣。","　　他垂首望向身旁的少女，「瑠璃。」","　　「唔？」聽見心上人的呼喚，瑠璃鼓著被西瓜塞滿的腮幫子抬起頭。","　　「西瓜很好吃，謝謝。我會另外帶著東西回禮的。」","　　「不、不用這麼客氣啦！」瑠璃趕緊嚥下西瓜，「是我自己想送東西給賢先生的……而且，那個，我也覺得很開心……」","　　瑠璃越講越小聲，賢的眼神不自覺地柔和下來。","　　「冰箱裡還剩半個西瓜，下次，我們一人一半如何？我會參考妳的建議的。」言及此處，賢隱隱彎了彎脣，「『西瓜就是要大口吃才過癮』……是吧？」","　　下次、一人一半、參考妳的建議……明明僅是普通幾個字，瑠璃的心臟卻為此劇烈地搏動起來。","　　她的心情實在很好懂。","　　瑠璃高高揚起嘴角，湖水般的眸閃閃發亮，嗓音中盡是掩蓋不了的愉悅：「哼哼……既然賢先生這麼說了，那麼，瑠璃一定會奉陪到底的～～！請多多指教！」"],"tags":["原世界觀"],"credit":"ⓒ 멸치 님","url":""},

    {"id":"witch-meeting","title":"","date":"","images":["album-witch.jpg"],"paragraphs":["‧₊˚ ⏾. ⋅","","　　據說在森林深處住著可怕的魔女。","　　她們法力高強，生性殘忍，會在夜晚將落單的孩子帶回木屋──白淨嬌嫩的丟入大釜，以文火煨煮，成為魔女的晚餐；皮糙肉厚的則對其施加禁錮的詛咒：往後永遠不得離開此處，一輩子做魔女的僕役……","","　　……","","　　賢丹尼爾不記得自己是怎麼來到這裡的了。","　　失去意識前最後的印象，是他孤獨地蜷縮在寒冬暗巷中，雪花悠悠飄落在他的頭髮、臉頰、睫毛，讓他的眼皮變得好沉、好沉……直到再也無力睜開雙眼。","　　但是現在，他正躺在一張陌生的床上，蓋著柔軟蓬鬆的被褥，望著天花板發呆。他勉強撐起因飢餓與寒冷而略為虛弱的身子，謹慎地環顧一圈。這間小屋布置得很古怪，多得數不清的瓶瓶罐罐裝著色澤鮮豔的液體，牆邊擺著不知名生物的骨骼標本，數本封面寫著「魔法」、「咒語」等詞的書雜亂地堆在角落……","　　他尚來不及細想，一聲驚呼先打斷了他的思緒。","　　「呀！你怎麼醒了？」","　　一名造型奇特的女子匆忙跑向床頭，華美的披風與長髮隨之飄逸。她的長裙層層疊疊地綴著蕾絲與緞帶，尖頂的帽子綁著一個浮誇的蝴蝶結，寬大的帽檐幾乎要擋住她的臉。","　　她屈膝與他相視，湖水藍的雙眼盛滿了擔憂。","　　「你還好嗎？那個……我不是什麼可疑的人喔！因為看見你一個人躺在路邊，外面又下著雪，我才……」","　　她的脣一張一闔，兀自對他喋喋不休著。賢卻沒有心思理她究竟說了些什麼，僅是默默盯著她那身童話故事般的裝束瞧──這般不尋常的穿著，加上四周詭譎幽暗的氛圍，一個不可思議的猜想逐漸在他腦內成形。","　　賢毫無預兆地開口：「妳是魔女嗎？」","　　「欸？」","　　她被問得一愣，半晌後始呆呆地應道：「好像是有人會這樣叫我……？」","　　果然啊。賢想起了曾在鎮上聽過的，有關於魔女的傳聞。","　　據說在森林深處住著可怕（是嗎？）的魔女。她們法力高強（有待商榷），生性殘忍（嗯……），會在夜晚將落單的孩子帶回木屋──啊，最後一點似乎沒有錯呢。","　　然而，她的眼眸是那樣澄澈、明亮，更勝他見過的所有水面與天空，一望見底，不摻有絲毫雜念。魔女小姐朝他伸出手，輕輕握住他的指尖，真誠地注視著他：「如果沒有地方可以去的話，你要不要留在我家呢？我正好覺得一個人生活的日子有點無聊……」","　　賢遲遲沒有回應。眼前的這位魔女與流言中邪惡可怖的印象相去甚遠，她溫柔、熱情、友善，親切得令人心生懷疑──不過，縱使真的事有蹊蹺，他的下場也不會比橫死街頭更差了。","　　於是，他終究緩緩地點了頭，「……好。」","　　魔女見狀，立即喜笑顏開，拉著他用力晃了兩下，「太棒了！請多多指……啊、等等！我忘記自我介紹了！」她這才擺出一副魔女的架勢，得意地清了清嗓：「我是瑠璃唷！瑠──璃──記住了嗎？」她故意放慢語速，頗有幾分諄諄教導稚童認字的意思，儘管賢早已過了那個年齡。「你呢，你叫什麼名字？」","　　「賢丹尼爾。請叫我賢就好了。」","　　「我知道了！那麼，小賢──」賢的動作一頓，並未對這個稱呼提出異議。瑠璃渾然不覺地繼續說道：「你在這裡等我一下！我去準備晚餐──是兩人份的晚餐喔！晚點再幫你換一套新的衣服，絕對會把你打扮得非常帥氣的！我的品味可是很不錯的哦？還有啊……」","　　瑠璃嘰嘰喳喳地講個不停，賢緊繃的神經亦不知不覺放鬆了下來。","　　雖然這位魔女小姐有點奇怪，且很聒噪，但他……並不討厭這種感覺。於他而言的家的模樣，第一次有了模糊的雛型。"],"tags":["魔女集會"],"credit":"ⓒ 사냐 님","url":""},

    {"id":"hunter-succubus-first-night","title":"","date":"","images":["album-hunter-succubus.png"],"paragraphs":["♱⃓","𝕿𝖍𝖊 𝕱𝖎𝖗𝖘𝖙 𝕹𝖎𝖌𝖍𝖙 …","","⁺‧₊˚ ཐི⋆♱⋆ཋྀ ˚₊‧⁺","","　　當夜色逐漸降下，即是惡魔拉開狂歡序幕之時。","","　　初生的魅魔缺乏辨識危險的能力，所謂勾引的技巧（或魔法？）亦不成熟，縱是如此，瑠璃仍抱持著莫名的樂觀，甚至尚有餘裕挑剔──雖說只是作為吸食精氣的對象，但畢竟是值得紀念的第一次，那至少要仔細選個賞心悅目的獵物！","　　忽地，一陣濃郁的甜香竄入鼻腔。","　　她未曾聞過那樣的氣味，卻已然知曉這股陌生味道所代表的意義──那是刻在她本能裡的，屬於人類男性的氣息──，她的瞳孔倏地收縮，五臟六腑隱隱震顫，前所未有的渴求令她頭暈目眩，不由自主地提起步伐。","　　她迫切地想要找到這個人，然後……","","　　在昏暗的小巷內，唯有那對綠色的眼眸依舊明亮銳利，他低頭看著這個不知為何現身的，絲毫沒有掩飾或偽裝的……魅魔？善於冷靜分析的獵人不免也浮現了一瞬的疑惑──這是某種陷阱？或是對方強大到不須在人間躲躲藏藏？然而，在解答出這些問題之前，他手中的鐮刀已先抵住了惡魔的咽喉。","　　「啊。」冰冷的金屬貼上肌膚，她猛地一哆嗦，如夢方醒地瞪大雙眼。可還不待她徹底回過神來，男人便以鐮刀輕輕抬起了她的下顎──她順著鐮刀的握柄往上望去，視線最終停在那張端正的面龐上。那名男子正目不轉睛地盯著她。","　　這個人類……好帥氣！瑠璃看直了眼，馬上將當前的險況拋諸腦後。","　　「那、那個……」她渾然未察對方將自己視為威脅，試探地主動出聲，雙頰無法自抑地浮上一層羞赧的緋色，彷若少女情竇初開；紅潤的脣瓣抿了抿，又微微噘起，神態甜美可欺，「你是住在這裡的人類嗎？我……我迷路了，正在尋找能借住一晚的地方……」","　　賢不為所動地打量著瑠璃。大約是隻魔力低微的魅魔，以人類的角度來看，有著十分漂亮的臉蛋──要是忽略掉她的角、翅膀和尾巴，應該會討很多人的喜歡；然而她的演技實在太過拙劣，面對如此不像樣的謊話，賢無言半晌，給出的唯一反應僅有揚高了眉。","　　「是，我住在這裡，負責在這片區域獵殺惡魔。」他語氣平淡地敘述，「而妳正是我要消滅的對象。」","　　獵殺？消滅……？瑠璃愣了愣，顯然尚未理解對方話中的涵義。該不會，他要殺掉我吧？思及此處，首度離開魔界的魅魔終於開始感到慌亂。她倉皇地後退兩步，下一秒被鐮刀毫不留情地勾住衣領捉回來。","　　這位獵人先生似乎不打算輕易放過她。","　　眼見逃跑行不通，瑠璃當機立斷放下魅魔的尊嚴（……真的有這種東西嗎？），抓住他的袖口，哭喪著臉向人類求情：「獵人先生，等一下，你聽我說……！我是惡魔沒錯，可、可是，今天是我第一次離開魔界，而你是我遇到的第一個人類！我真的沒有傷害過人……」雖然是因為還來不及找人下手……她有些心虛地想。","　　「所以，獵人先生，你能看在我是個善良的惡魔的份上饒了我嗎……？」","　　賢沉默地望著她。如她所言，他早已注意到瑠璃身上並未沾染人類的氣息，她也不像是有本事將證據完美湮滅──綜上所述，最合理的解釋，便是她真的只是個倒楣透頂、好巧不巧挑到自己作為目標對象的低階魅魔罷了。","　　「那個……獵人先生？」","　　瞅著她討好又緊張的表情，明知對方是與人站在對立面的惡魔，賢卻莫名生出在欺負小動物的錯覺……真奇怪啊。","　　「就這麼放妳離開是不可能的，不過……我對隨意使用暴力沒有興趣。」瑠璃忐忑地眨了眨眼，賢不動聲色地繼續道：「既然妳不曾造成傷亡，我同樣不該濫殺無辜，條件是──妳的一舉一動要由我來看管。」他緩緩收回了鐮刀，「我會給妳住的地方，不許隨意離開或接觸人類，做任何事之前都要先問過我。簡而言之，就是用妳的自由換取一條生路……怎麼樣？妳願意接受嗎？」","　　瑠璃偏首思考了片刻，「那麼……獵人先生會跟我住在一起嗎？」","　　「為了就近監視妳，是的。」","　　……所以，如果我同意了，我不但不會被殺掉，還可以跟長相帥氣的獵人先生同居，順利的話，甚至能透過他飽餐一頓……！瑠璃越想越覺得這個提議真是百利而無一害，怎麼會有這樣的好事？這麼看來，在人間吸取精氣果然不是什麼困難的事情呀！","　　「我、我願意，獵人先生，我會好好表現的！」得意忘形的魅魔小姐迅速點頭同意，賢瞧她那副喜上眉梢的模樣，僅是無奈地歎了口氣。","　　撿了一個比人類更加單純的惡魔回家，究竟是不是正確的選擇呢？","　　瑠璃的尾巴不知何時纏上了賢的腰間，兩人的距離因此驀地拉近；她撒嬌般地仰起臉，水光瀲灩的眸子盛滿了愛慕與崇拜，強烈得近乎使他想別過眼去。瑠璃先發制人開口，不讓他有機會逃避：「獵人先生、獵人先生，你快點帶我回家嘛……」","　　……現在倒是有幾分魅魔的樣子了？","","　　天空破曉之際，則為惡魔隱沒歸巢的時分。","　　獵人先生攜著初訪人間的魅魔小姐，一同消失在了街道的盡頭。"],"tags":["獵人×魅魔"],"credit":"ⓒ 햄양 님","url":"","paragraphAlign":["left","center","left","center","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left","left"]},

// ═══════════════ 以下為功能程式 ═══════════════
const escapeHTML = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(value){try{const u=new URL(value,location.href);return ['https:','http:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function imageURL(value){if(!value)return '';try{const u=new URL(value,location.href);return ['https:','http:','file:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function paragraphs(items,alignments=[],links=[]){
  if(!items?.length){
    return '<p class="content-empty">內容準備中，故事會慢慢補上。</p>';
  }
  return items.map((p,index)=>{
    if(p==='')return '<div class="paragraph-spacer" aria-hidden="true"></div>';
    let text=escapeHTML(p)
      .replace(/&lt;(\/?)(strong|b|em|i|u|s)&gt;/gi,'<$1$2>')
      .replace(/&lt;br\s*\/?&gt;/gi,'<br>')
.replaceAll('&lt;span class=&quot;light-text&quot;&gt;','<span class="light-text">')
.replaceAll('&lt;/span&gt;','</span>');
    for(const link of links||[]){
      if(link.index!==index||!link.text)continue;
      const href=safeURL(link.url);if(!href)continue;
      const label=escapeHTML(link.text);
      text=text.replace(label,'<a class="inline-song-link" href="'+escapeHTML(href)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>');
    }
    return '<p class="entry-paragraph'+(['left','center','right'].includes(alignments[index])?' align-'+alignments[index]:'')+'">'+text+'</p>';
  }).join('');
}
function outgoing(url,label){const href=url&&safeURL(url);return href?'<a class="external-link" href="'+escapeHTML(href)+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(label)+' ↗</a>':'';}

function taipeiToday(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const part=t=>parts.find(p=>p.type===t).value;return part('year')+'-'+part('month')+'-'+part('day');}

function eventsForDate(key){
  const events=CONTENT.events.filter(e=>e.annual?key.slice(5)===e.date.slice(5)&&key>=e.date:e.date===key).map(e=>{
    if(!e.anniversary||key.slice(0,4)===e.date.slice(0,4))return e;
    return {...e,title:anniversaryTitle(Number(key.slice(0,4))),description:'和賢先生一起度過 '+(Number(key.slice(0,4))-Number(e.date.slice(0,4)))+' 年了♡'};

  if(!events.length&&CONTENT.works.some(w=>w.date===key)&&!(Number.isInteger(interval)&&interval>0&&day>0&&day%interval===0))events.push({title:'這一天的紀念圖文',description:'',url:''});

function dayNumberForDate(key){

}

function upcomingDates(){
  const today=taipeiToday(),base=Date.parse(today+'T00:00:00Z'),items=[];
  for(let offset=0;offset<=3660 && items.length<1;offset++){
    const key=new Date(base+offset*86400000).toISOString().slice(0,10);
    for(const event of eventsForDate(key)){
      items.push({date:key,title:event.title,days:offset});
      if(items.length===1)break;
    }
  }
  return items;
}

 layer.style.cssText='position:fixed;pointer-events:none;z-index:90;overflow:hidden;border-radius:42px;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';
 const image=document.createElement('img');image.src=src;image.alt=alt;
 image.style.cssText='position:absolute;display:block;object-fit:cover;max-width:none;left:'+(to.left-r.left)+'px;top:'+(to.top-r.top)+'px;width:'+to.width+'px;height:'+to.height+'px;transform-origin:0 0';
 layer.append(image);document.body.append(layer);
 hiddenImage.style.visibility='hidden';$('page').inert=true;
 const animation=image.animate([
  {transform:'translate('+(from.left-to.left)+'px,'+(from.top-to.top)+'px) scale('+(from.width/to.width)+','+(from.height/to.height)+')',borderRadius:'3px'},
  {transform:'none',borderRadius:'10px'}
 ],{duration:360,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});
 animation.finished.catch(()=>{}).finally(()=>{hiddenImage.style.visibility='';layer.remove();animation.cancel();$('page').inert=false;});
}
function openAlbumPhoto(index,button){
 const image=button.querySelector('img');
 albumPhotoReturn={index,tag:albumTag,scrollTop:$('pageBody').scrollTop};
 const from=image?photoBounds(image):null;
 renderWork(index);
 const target=$('workImage');
 if(from&&target)animateAlbumPhoto(target.src,target.alt,from,photoBounds(target),target);
}
function closeAlbumPhoto(){
 const source=$('workImage'),from=source?photoBounds(source):null;
 const src=source?.src,alt=source?.alt||'';
 const previous=albumPhotoReturn;
 if(previous)albumTag=previous.tag;
 renderAlbum();
 if(previous)$('pageBody').scrollTop=previous.scrollTop;
 const target=previous?$('pageBody').querySelector('[data-work="'+previous.index+'"] img'):null;
 if(from&&target)animateAlbumPhoto(src,alt,from,photoBounds(target),target);
 albumPhotoReturn=null;
}
// Post-to-post navigation keeps the current album filter and return destination.
const renderWorkWithoutPostNavigation=renderWork;
renderWork=function(index,origin='album',navigation=null){
  const returnToCalendar=navigation?navigation.calendarReturn:null;
  const indices=navigation?navigation.indices:CONTENT.works.map((work,i)=>({work,i})).filter(({work})=>origin==='calendar'||!albumTag||(work.tags||[]).includes(albumTag)).map(({i})=>i);
  renderWorkWithoutPostNavigation(index,origin);
  if(featureState.app!=='photos'||featureState.view!=='work')return;
  if(navigation){featureState.calendarReturn=returnToCalendar;$('back').textContent=returnToCalendar?'‹ 日曆':'‹ 相簿';}
  featureState.postIndices=indices;
  const position=indices.indexOf(index);
  const nav=document.createElement('nav');nav.className='album-post-navigation';nav.setAttribute('aria-label','切換相簿貼文');
  nav.innerHTML='<button type="button" data-post-step="-1" aria-label="上一篇"'+(position<=0?' disabled':'')+'><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span>上一篇</span></button><span class="album-post-count">'+(position+1)+' / '+indices.length+'</span><button type="button" data-post-step="1" aria-label="下一篇"'+(position<0||position>=indices.length-1?' disabled':'')+'><span>下一篇</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>';
  $('pageBody').prepend(nav);
};
function adjacentAlbumPost(indices,index,step){
  const position=indices.indexOf(index),next=position+step;
  return position<0||next<0||next>=indices.length?null:indices[next];
}
function navigateAlbumPost(step){
  if(current!=='page'||currentApp!=='photos'||featureState.view!=='work'||$('page').inert)return;
  const indices=featureState.postIndices||[];
  const next=adjacentAlbumPost(indices,featureState.index,step);
  if(next===null)return;
  const context={indices,calendarReturn:featureState.calendarReturn};
  if(!context.calendarReturn&&albumPhotoReturn)albumPhotoReturn.index=next;
  const body=$('pageBody'),page=$('page');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){renderWork(next,'album',context);return;}
  const previousScroll=body.scrollTop;
  const oldView=body.cloneNode(true);oldView.removeAttribute('id');
  oldView.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  oldView.setAttribute('aria-hidden','true');oldView.inert=true;
  oldView.style.cssText='position:absolute;left:'+body.offsetLeft+'px;top:'+body.offsetTop+'px;width:'+body.clientWidth+'px;height:'+body.clientHeight+'px;margin:0;z-index:2;pointer-events:none;background:#fcf7fa;overflow:hidden;box-sizing:border-box';
  renderWork(next,'album',context);
  page.append(oldView);oldView.scrollTop=previousScroll;page.inert=true;
  const width=body.clientWidth;
  const options={duration:310,easing:'cubic-bezier(.22,.7,.25,1)',fill:'both'};
  const outgoing=oldView.animate([{transform:'translateX(0)'},{transform:'translateX('+(-step*width)+'px)'}],options);
  const incoming=body.animate([{transform:'translateX('+(step*width)+'px)'},{transform:'translateX(0)'}],options);
  Promise.allSettled([outgoing.finished,incoming.finished]).then(()=>{
    oldView.remove();outgoing.cancel();incoming.cancel();page.inert=false;
  });
}
$('pageBody').addEventListener('click',event=>{
 const button=event.target.closest('[data-post-step]');if(button&&!button.disabled)navigateAlbumPost(Number(button.dataset.postStep));
});
let albumSwipe=null;
$('pageBody').addEventListener('touchstart',event=>{
 albumSwipe=null;
 if(event.touches.length!==1||featureState.app!=='photos'||featureState.view!=='work'||$('page').inert||!event.target.closest('.work-detail')||event.target.closest('a,.image-nav button'))return;
 const touch=event.touches[0];albumSwipe={x:touch.clientX,y:touch.clientY,index:featureState.index};
},{passive:true});
$('pageBody').addEventListener('touchend',event=>{
 const start=albumSwipe;albumSwipe=null;
 if(!start||event.touches.length||event.changedTouches.length!==1||featureState.index!==start.index)return;
 const touch=event.changedTouches[0],dx=touch.clientX-start.x,dy=touch.clientY-start.y;
 if(Math.abs(dx)>=55&&Math.abs(dx)>Math.abs(dy)*1.5)navigateAlbumPost(dx<0?1:-1);
},{passive:true});
$('pageBody').addEventListener('touchcancel',()=>{albumSwipe=null;},{passive:true});
// Mouse drags complement touch swipes on every viewport size.
let albumMouseSwipe=null,albumBlockClickUntil=0;
$('pageBody').addEventListener('pointerdown',event=>{
 if(event.pointerType!=='mouse'||event.button!==0)return;
 albumMouseSwipe=null;
 if(featureState.app!=='photos'||featureState.view!=='work'||$('page').inert||!event.target.closest('.work-detail')||event.target.closest('a,.image-nav button'))return;
 albumMouseSwipe={x:event.clientX,y:event.clientY,index:featureState.index};
});
document.addEventListener('pointerup',event=>{
 if(event.pointerType!=='mouse')return;
 const start=albumMouseSwipe;albumMouseSwipe=null;
 if(!start||featureState.index!==start.index)return;
 const dx=event.clientX-start.x,dy=event.clientY-start.y;
 if(Math.abs(dx)>=55&&Math.abs(dx)>Math.abs(dy)*1.5){albumBlockClickUntil=Date.now()+450;navigateAlbumPost(dx<0?1:-1);}
});
document.addEventListener('pointercancel',()=>{albumMouseSwipe=null;});
$('pageBody').addEventListener('dragstart',event=>{if(event.target.closest('.album-art'))event.preventDefault();});
$('pageBody').addEventListener('click',event=>{
 if(Date.now()<albumBlockClickUntil){event.preventDefault();event.stopImmediatePropagation();}
},true);
// Summary text is a label; only its arrow accepts pointer toggles.
document.addEventListener('click',event=>{
 const summary=event.target.closest('.meeting-fold>summary');
 if(summary&&!event.target.closest('.meeting-arrow'))event.preventDefault();
},true);
</script></body></html>
